services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-lendloopsecret123}
      - WEBHOOK_URL=${N8N_WEBHOOK_BASE_URL:-http://localhost:5678/}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-lendloop-shared-hmac-secret-key-prod}
      - CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-https://your-convex-deployment.convex.cloud}
      - GENERIC_TIMEZONE=UTC
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168 # 7 days
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    driver: local
